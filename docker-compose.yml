version: '3'

services:
  postgresql:
    container_name: database
    image: postgres:latest
    environment:
      POSTGRES_USER: woodpecker
      POSTGRES_PASSWORD: woodpecker
      POSTGRES_DB: mpi_db
    expose:
      - "5432"
    networks:
      - postgres_ntw
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U woodpecker -d mpi_db" ]
      interval: 10s
      retries: 5

  mpi-backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - POSTGRES_HOST=postgresql
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - ENVIRONMENT=dev
      - SECRET_KEY=${SECRET_KEY}
      - LOGIN_EMAIL=${LOGIN_EMAIL}
      - SMTP_SERVER=${SMTP_SERVER}
      - LOGIN_PWD=${LOGIN_PWD}
      - INVOICE_DOWNLOAD_FOLDER=${INVOICE_DOWNLOAD_FOLDER}
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - postgres_ntw

networks:
  postgres_ntw:
    driver: bridge
