version: '3.0'

services:
  mpi_database:
    container_name: main_database
    image: postgres:16
    shm_size: '256m'
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=64MB
        -c maintenance_work_mem=128MB
        -c effective_cache_size=1GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
    environment:
      POSTGRES_USER: woodpecker
      POSTGRES_PASSWORD: woodpecker
      POSTGRES_DB: mpi_db
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - mpi_pgdata:/var/lib/postgresql/data
    networks:
      - postgres_ntw
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U woodpecker -d mpi_db" ]
      interval: 10s
      retries: 5

  mpi-backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - POSTGRES_HOST=postgresql
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - ENVIRONMENT=dev
      - SECRET_KEY=${SECRET_KEY}
      - LOGIN_EMAIL=${LOGIN_EMAIL}
      - SMTP_SERVER=${SMTP_SERVER}
      - LOGIN_PWD=${LOGIN_PWD}
      - INVOICE_DOWNLOAD_FOLDER=${INVOICE_DOWNLOAD_FOLDER}
    depends_on:
      mpi_database:
        condition: service_healthy
    networks:
      - postgres_ntw
volumes:
  mpi_pgdata: {}

networks:
  postgres_ntw:
    driver: bridge
