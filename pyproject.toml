[project]
name = "mpi-backend"
version = "0.1.0"
description = "MPI Plumbing Backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core Framework
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.9",
    "starlette==0.47.3",
    "fastapi-pagination==0.9.0",
    # Database & ORM
    "SQLAlchemy==2.0.43",
    "alembic==1.16.5",
    "psycopg2-binary==2.9.10",
    "pyodbc==5.2.0",
    # Data Processing
    "pandas==2.3.2",
    "numpy==1.26.4",
    "openpyxl==3.1.5",
    "xlsxwriter==3.2.8",
    "dbt-core==1.7.17",
    "dbt-postgres==1.7.17",
    "elementary-data[postgres]==0.22.0",
    # PDF Processing
    "PyMuPDF==1.26.4",
    "tabula-py==2.10.0",
    "PyPDF2==3.0.1",
    "PyPDF4==1.27.0",
    "pypdf>=4.0.0,<6.0.0", # FLEXIBILITY REQUIRED: Dependency of camelot-py which mandates pypdf v4+ for PDF table extraction compatibility
    "camelot-py==1.0.9",
    # Authentication & Security
    "PyJWT==2.8.0",
    "bcrypt==4.1.2",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "cryptography>=43.0.0", # FLEXIBILITY REQUIRED: Security-critical package that must receive vulnerability patches and security updates immediately
    "cffi==1.17.1",
    "pycparser==2.22",
    # Background Tasks
    "APScheduler==3.10.4",
    # HTTP Clients
    "requests==2.32.5",
    "httpx==0.27.0",
    "aiohttp==3.13.2",
    # Cloud Storage
    "boto3==1.42.14",
    "botocore==1.42.14",
    # Image Processing
    "opencv-python-headless==4.8.1.78",
    "pillow==11.3.0",
    # Windows Support
    "pywin32==311; sys_platform=='win32'",
    # Email
    "email-validator==2.1.1",
    # Utilities
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "tzdata==2025.2",
    "charset-normalizer==3.3.2",
    "chardet==5.2.0",
    "tabulate==0.9.0",
    "distro==1.9.0",
    "python-dotenv==1.0.1",
    # Async
    "anyio==4.3.0",
    # Web Framework Extras
    "click==8.1.7",
    "colorama==0.4.6",
    "et-xmlfile==2.0.0",
    "greenlet==3.2.4",
    "h11==0.16.0",
    "idna==3.7",
    "Mako==1.3.10",
    "MarkupSafe==3.0.2",
    "pydantic-settings==2.7.1",
    "six==1.16.0",
    "sniffio==1.3.1",
    "typing-inspection==0.4.1",
    "typing-extensions==4.12.2",
    "annotated-types==0.6.0",
    # Performance & Monitoring
    "psutil==5.9.8",
    "memory-profiler==0.61.0",
    # Logging
    "loguru==0.7.2",
    # File Handling
    "watchdog==4.0.0",
    # JSON & Serialization
    "orjson==3.10.14",
    "ujson==5.8.0",
    # Caching
    "redis==5.0.1",
    "diskcache==5.6.3",
    # String Matching & Fuzzy Search
    "rapidfuzz==3.14.3",
    "fuzzywuzzy==0.18.0",
    "python-Levenshtein==0.27.3",
    # Additional Dependencies
    "google-api-python-client==2.181.0",
    "jpype1==1.6.0",
    # AI/ML - Chatbot Dependencies
    "langchain==0.3.0",
    "langchain-google-genai==2.0.0",
    "langchain-openai==0.2.0",
    "google-generativeai==0.7.2",
    "openai==1.50.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth>=2.41.1",
    "google-genai>=1.2.0",
    "usaddress>=0.5.16",
    "weasyprint>=68.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'win32' and platform_machine == 'x86'",
    "sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-mock==3.12.0",
    "ipython==8.22.0",
    "testcontainers==4.13.2",
    "moto==5.1.12",
    "pdf2image==1.17.0",
]
