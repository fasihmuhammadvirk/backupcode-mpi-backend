[pytest]
# Test discovery and execution
testpaths = mpi_backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Additional options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    ; --cov=mpi_backend
    ; --cov-report=html:htmlcov
    ; --cov-report=term-missing
    ; --cov-report=xml
    ; --cov-fail-under=95
    ; --cov-config=.coveragerc

# Async support
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Markers for test organization
markers =
    unit: Unit tests (isolated, mocked dependencies)
    integration: Integration tests (real database, multiple components)
    functional: Functional/acceptance tests
    performance: Performance and load tests
    business_logic: Business logic tests (critical business rules)
    slow: Slow running tests
    requires_db: Tests that require database connection
    requires_external: Tests that require external services
    asyncio: Async tests using asyncio
    # Document Classifier specific markers
    ml_accuracy: Machine learning accuracy validation tests
    stress_test: Stress testing with large datasets
    scalability: Scalability and concurrency tests
    memory_profile: Memory usage profiling tests
