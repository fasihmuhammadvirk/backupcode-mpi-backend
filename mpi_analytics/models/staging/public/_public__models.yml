version: 2

models:
  - name: stg__item_classification
    description: Staging model for item classification mappings.
    columns:
      - name: id
        description: Primary key.
      - name: sheet_name
        description: Normalized sheet_name value using normalize_sheet_name macro.
      - name: category
        description: "Account code: M, E, or A."

  - name: stg__quickbooks_items
    description: Staging model for exported QuickBooks items.
    columns:
      - name: invoice_items_id
        description: ID of the item in mart__invoice_items.
      - name: invoice_id
        description: ID of the parent invoice.
      - name: exported_at
        description: Timestamp of export.
