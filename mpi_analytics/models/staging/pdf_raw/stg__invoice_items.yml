version: 2

models:
  - name: stg__invoice_items
    description: |
      Staged data from the raw `invoice_items` table. Performs basic cleaning, trimming, and type casting. Filters for active records.

      This model is the first layer of transformation. Its purpose is to select raw data from the source,
      perform basic cleaning (like trimming whitespace), and cast columns to their correct data types.
      This creates a consistent and reliable base for downstream intermediate and mart models.

      This replaces the need for basic data cleaning (e.g., `TRIM`) that happens in various places in the 
      `InvoiceItems.py` controller.

    columns:
      - name: invoice_items_id
        description: "The primary key for the invoice item (`public.invoice_items` table)"
        tests:
          - unique
          - not_null
      - name: invoice_id
        description: "The foreign key to the invoice (`public.invoices` table)."
      - name: filename
        description: "The filename of the PDF."
      - name: item
        description: "The original item code from the invoice."
      - name: mpi_item
        description: "The mapped MPI item code."
      - name: vendor
        description: "The name of the supplier or vendor."
      - name: description
        description: "The original item description from the invoice."
      - name: mpi_description
        description: "The mapped MPI item description."
      - name: customer_job
        description: "The customer or job associated with the item."
      - name: class_
        description: "Purpose unknown. TODO: investigate"
      - name: ref_no
        description: "The invoice reference number."
      - name: po_number
        description: "The purchase order number."
      - name: account
        description: "The original account from the invoice."
      - name: buyer
        description: "The name of the buyer."
      - name: sheet_name
        description: "The name of the sheet from the source file."
      - name: export_status
        description: "The export status of the item (e.g., 'Pending')."
      - name: is_active
        description: "Flag indicating if the record is active."
      - name: date
        description: "The date of the invoice item."
      - name: date_added
        description: "The date of that the invoice was added to the database."
      - name: cost
        description: "The cost of the item (as text)."
      - name: qty
        description: "The quantity of the item (as text)."
      - name: amount
        description: "The total amount for the item line (as text)."
      - name: memo
        description: "Any memo created by the MPI team"
