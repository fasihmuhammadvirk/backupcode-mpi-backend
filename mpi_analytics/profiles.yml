mpi_analytics:
  target: dev
  outputs:
    dev:
      dbname: "{{ env_var('POSTGRES_DB') }}"
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('DBT_POSTGRES_USERNAME', env_var('POSTGRES_USERNAME')) }}"
      password: "{{ env_var('DBT_POSTGRES_PASSWORD', env_var('POSTGRES_PASSWORD')) }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      schema: analytics
      threads: 1
      type: postgres
      connect_timeout: 30
      keepalives_idle: 60
      keepalives_interval: 15
      keepalives_count: 4
      retries: 2

elementary:
  target: dev
  outputs:
    dev:
      dbname: "{{ env_var('POSTGRES_DB') }}"
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USERNAME') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      schema: analytics_elementary
      threads: 1
      type: postgres
      connect_timeout: 30
      keepalives_idle: 60
      keepalives_interval: 15
      keepalives_count: 4
      retries: 2
